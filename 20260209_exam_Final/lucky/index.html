    <!-- load 載入畫面 寫在body 的最底部
    確保它能「蓋住」所有東西 (Z-index 層級) 在 CSS 中，雖然你可以用 z-index 來控制誰在上面，但 HTML 的先後順序也會影響渲染
    即便你不設定 z-index，#load 因為是最後畫上去的，它自然會疊在最上面
    避免 z-index 失靈  
    如果你把 #load 寫在最前面，雖然你給它 z-index: 15，
    但如果後面的 main 剛好也有設定 position 屬性，
    有時候會產生「層疊上下文（Stacking Context）」的衝突，導致 #load 莫名其妙被擋住。
    把它寫在最後面，就是為了避開這種複雜的 CSS 計算，直接利用 HTML 的先後順序來保證它一定在最上層-->
    <div id="load" class="none">
